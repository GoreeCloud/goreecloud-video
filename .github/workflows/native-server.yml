name: Native Server

on:
  pull_request:
    paths:
      - "native/server/**"
      - ".github/workflows/native-server.yml"
  push:
    branches: [main]
    paths:
      - "native/server/**"
      - ".github/workflows/native-server.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/server/go.mod
          cache: false
      - name: Format check
        run: |
          files="$(gofmt -l .)"
          printf '%s\n' "$files"
          test -z "$files"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
